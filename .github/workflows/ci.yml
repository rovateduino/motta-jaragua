name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test e build
    runs-on: ubuntu-latest
    env:
      # Sem DATABASE_URL: o catálogo e as configurações da loja degradam para
      # "manutenção" quando o banco não está configurado, então build e testes
      # rodam sem Postgres. As URLs exigidas pelo schema entram só no passo de
      # validação do Prisma.
      APP_MODE: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Prisma validate
        env:
          # `prisma validate` não conecta ao banco, mas exige as variáveis
          # referenciadas no schema (url e directUrl).
          DATABASE_URL: postgresql://motta:motta@localhost:5432/motta?schema=public
          DIRECT_URL: postgresql://motta:motta@localhost:5432/motta?schema=public
        run: npm run db:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (SQLite + Chromium)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      APP_MODE: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Preparar SQLite e rodar E2E
        run: npm run test:e2e:local

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
